# IP-only preview with a publicly trusted short-lived certificate.
# Keep port 80 reachable for unattended ACME renewal.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 101.33.35.107;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://101.33.35.107$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 101.33.35.107;
    ssl_certificate /etc/letsencrypt/live/cet6-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cet6-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CET6TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    root /opt/cet6-buddy/current/dist;
    index index.html;
    location = /server { return 404; }
    location ^~ /server/ { return 404; }
    location ~ /\. { return 404; }
    # Legacy local-upload request is rejected by the API before COS direct upload.
    # Keep the documented maximum file size compatible during this transition.
    client_max_body_size 51m;
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /health { proxy_pass http://127.0.0.1:8787/health; }
    location / { try_files $uri $uri/ /index.html; }
}
